spring.application.name=paper3
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/quantum}
spring.datasource.username=${DATABASE_USER:quantum_admin}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=quantum_schema


file.storage=${FILE_STORAGE:./data/uploads}

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB


jwt.secret=${JWT_SECRET}
jwt.expiration.seconds=86400

spring.jpa.open-in-view=false
python.service.base-url=${PYTHON_SERVICE_URL:http://127.0.0.1:8000}
server.address=127.0.0.1
