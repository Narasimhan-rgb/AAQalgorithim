spring.application.name=paper3
server.port=${SERVER_PORT:8080}

spring.datasource.url=${AAQ_DB_URL:jdbc:postgresql://localhost:5432/quantum}
spring.datasource.username=${AAQ_DB_USERNAME:quantum_admin}
spring.datasource.password=${AAQ_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${AAQ_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${AAQ_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=${AAQ_DB_SCHEMA:quantum_schema}

file.storage=${AAQ_FILE_STORAGE:./data}

spring.servlet.multipart.max-file-size=1000MB
spring.servlet.multipart.max-request-size=1000MB

jwt.secret=${AAQ_JWT_SECRET}
jwt.expiration.seconds=${AAQ_JWT_EXPIRATION_SECONDS:86400}

spring.jpa.open-in-view=false
python.service.base-url=${AAQ_PYTHON_SERVICE_URL:http://localhost:8000}
